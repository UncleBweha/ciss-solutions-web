# Deploys the Next.js store to the VPS (container ciss-store) on every push to main,
# or manually: Actions tab -> "Deploy store to VPS" -> Run workflow.
# The domain already proxies to ciss-store, so a push only replaces the container
# (with rollback if the new one is unhealthy); it does not touch Caddy.
# Uses the same repository secrets as deploy.yml: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS.
# Production env values live on the server in /opt/ciss-store/.env, not in GitHub.
name: Deploy store to VPS

on:
  # After CI has finished for a push to main (see the job's condition): a commit that
  # fails its checks is not deployed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      switch_traffic:
        description: Point cisssolutions.co.ke at the store after a healthy deploy
        type: boolean
        default: false

concurrency:
  group: deploy-store
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI checked, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: bash deploy/app-deploy.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "$HOME/.ssh/deploy_key"

      - name: Switch traffic to the store
        if: ${{ inputs.switch_traffic }}
        run: bash deploy/app-switch.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" app "$HOME/.ssh/deploy_key"
