# Checks the Next.js store on every push and pull request.
# Runs against a throwaway local Supabase stack (migrations + seed), so it needs
# no secrets and never touches the production database.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase (local stack)
        run: |
          npx supabase start -x studio,edge-runtime,logflare,vector
          npx supabase status -o env > /tmp/sb.env

      - name: Write .env.local for tests and build
        run: |
          set -a; . /tmp/sb.env; set +a
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MPESA_ENV=mock"
            echo "MPESA_CALLBACK_SECRET=ci-callback-secret"
            echo "CRON_SECRET=ci-cron-secret"
            echo "EMAIL_PROVIDER=log"
          } > .env.local

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Database tests (order lifecycle, RLS)
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: E2E (production build)
        run: |
          set -a; . ./.env.local; set +a
          MPESA_ALLOW_MOCK=true PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:3000/robots.txt && break; sleep 1; done
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://127.0.0.1:3000 npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
