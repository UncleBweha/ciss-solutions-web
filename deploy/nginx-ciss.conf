# CISS Solutions "coming soon" page, an independent Nginx site.
# Installed by deploy.sh as /etc/nginx/sites-available/ciss-solutions; removed by remove.sh.
# LISTEN_PORT / SERVER_NAME are filled in by deploy.sh.
server {
    listen LISTEN_PORT;
    listen [::]:LISTEN_PORT;
    server_name SERVER_NAME;

    root /var/www/ciss-solutions;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location ~ /\. { deny all; }
}
